# ArchiTech chat WebSocket route. Keep it on the same backend as /api/chat.
location /ws/ {
  proxy_pass http://host.docker.internal:51788;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Ssl on;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Backend runtime must use SERVER_FORWARD_HEADERS_STRATEGY=native so Spring/Tomcat
# preserves the original secure transport when TLS terminates at this proxy.
