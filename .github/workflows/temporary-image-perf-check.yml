name: Temporary route-aware LCP photo verification
on:
  push:
    branches:
      - design/premium-steampunk-home
jobs:
  image-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - name: Verify preloads, selected AVIF, no duplicates, responsive images
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/temporary-image-perf-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-preload-regression
          path: /tmp/image-perf-check
          if-no-files-found: ignore
