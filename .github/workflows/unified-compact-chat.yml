name: Unified compact chat build
on:
  push:
    branches: [feature/compact-unified-chat]
  pull_request:
    branches: [design/premium-steampunk-home]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
