name: Temporary static pages rebrand verification
on:
  push:
    branches:
      - design/premium-steampunk-home
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install chromium
      - name: Smoke-test static pages and capture screenshots
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/temporary-static-pages-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-page-screenshots
          path: /tmp/static-page-screenshots
          if-no-files-found: ignore
